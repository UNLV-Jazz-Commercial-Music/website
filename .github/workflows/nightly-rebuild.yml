# Nightly rebuild.
#
# WHY THIS EXISTS
# The site is static: it reads the events Google Sheet at build time and bakes
# the results into HTML. That is what makes it fast and free, but it means
# adding an event to the Sheet does NOT change the website until something
# rebuilds it. This job is that something.
#
# It runs at 10:00 UTC — 3:00 AM Pacific in summer, 2:00 AM in winter — so a
# concert added during the day is live by the next morning.
#
# ⚠️ KNOWN LIMITATION, READ THIS
# GitHub automatically DISABLES scheduled workflows after 60 days with no
# repository activity. Since faculty edit the Sheet rather than this repo, this
# repo can easily sit untouched for months, and then nightly rebuilds stop
# silently — the site would freeze on whatever events it last saw.
#
# GitHub emails repository admins before disabling, and re-enabling is one click
# in the Actions tab. But relying on someone noticing that email is exactly the
# kind of fragility this project is meant to avoid. If the site is going to sit
# idle for long stretches, move this trigger to a scheduler that does not
# expire. Tracked in the vault note "Website Rebuild".
#
# SETUP REQUIRED
# This needs a repository secret named NETLIFY_BUILD_HOOK, holding the build
# hook URL from Netlify (Site configuration → Build & deploy → Build hooks).
# Add it under Settings → Secrets and variables → Actions → New repository
# secret. It is a secret because anyone holding that URL can trigger builds.

name: Nightly rebuild

on:
  schedule:
    - cron: '0 10 * * *'
  # Lets you trigger a rebuild by hand from the Actions tab, without waiting for
  # the schedule — useful right after adding an event you want live now.
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Netlify to rebuild
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set — nothing to call."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$BUILD_HOOK")
          echo "Netlify responded $status"
          # Netlify answers 200 or 201 when it accepts the build request.
          case "$status" in
            200|201) echo "Rebuild requested." ;;
            *) echo "Unexpected response; build may not have started."; exit 1 ;;
          esac

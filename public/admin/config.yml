# Sveltia CMS configuration.
#
# This is what turns "someone who can write code" into "anyone with the shared
# login" for everything except events, which already live in the Google Sheet.
#
# ⚠️ AFTER EDITING THIS FILE, TELL EDITORS TO RELOAD /admin.
# A save writes ONLY the fields the browser's loaded config knows about, and
# silently drops everything else. Someone with /admin open from before a config
# change will therefore wipe any field added since — this happened on
# 2026-09-04, when a save deleted the `aliases` field from every ensemble and
# detached three concerts. `npm run check` caught it; nothing on the page
# looked wrong. Reload after config changes, and run the check afterwards.
#
# Editors go to /admin, sign in with GitHub, fill in forms, and hit Save. Saving
# commits to this repo, which triggers a Cloudflare rebuild. Nobody ever
# sees a file.
#
# HOW THE LOGIN WORKS
#
# Content lives in this repo, so the CMS is host-independent — except for
# authentication, which needs an OAuth client sitting between the browser and
# GitHub. On Cloudflare that is the Sveltia CMS Authenticator, a Worker
# maintained by the Sveltia team:
#     https://github.com/sveltia/sveltia-cms-auth
#
#  1. Deploy that Worker, following its repository's instructions. Give it the
#     GitHub OAuth App's Client ID and Secret as Worker secrets.
#  2. Update the GitHub OAuth App's callback URL to the Worker's URL. It used to
#     point at https://api.netlify.com/auth/done and that stops working once
#     Netlify is gone.
#  3. Set `base_url` below to the Worker's URL.
#
# Full context in HOSTING.md, including why the site left Netlify.
#
# Sveltia also offers "Sign In with Token" using a GitHub personal access
# token, which needs no OAuth setup at all. That's fine for a developer testing
# the CMS, but not for faculty — hence the OAuth route above.
#
# WHY JSON FILES RATHER THAN A DATABASE:
# Content stays in this repo as plain data. If this CMS were abandoned tomorrow,
# the site keeps running and nothing is lost — that is the whole reason for
# choosing a git-based CMS over a hosted one, after Weebly took the old site's
# content with it.

backend:
  name: github
  repo: UNLV-Jazz-Commercial-Music/website
  branch: main
  #
  # base_url must be set to the Sveltia CMS Authenticator Worker's URL once it
  # is deployed. Uncomment and fill in:
  #
  #   base_url: https://YOUR-AUTHENTICATOR.workers.dev
  #
  # While the site was on Netlify this was deliberately ABSENT, because Sveltia
  # defaults to Netlify as its OAuth client. Off Netlify, it is required.
  #
  # It must NEVER point at api.netlify.com. Unlike Decap/Netlify CMS — where
  # base_url meant the OAuth proxy — in Sveltia it means the OAuth client URL,
  # and pointing it at Netlify's API makes Sveltia treat that as a self-hosted
  # GitHub server. Login then fails confusingly. See HOSTING.md.

# Where uploaded images land. media_folder is the path in the repo;
# public_folder is how the site refers to them in HTML.
media_folder: public/uploads
public_folder: /uploads

# Uploads are processed before they're committed, which matters a lot here:
# press photos and album scans routinely arrive at 10-20 MB, and images in
# public/ are served as-is with no build-time optimization. Without this, one
# well-meaning upload makes the site slow for everyone on a phone.
#
#   - raster images (JPEG, PNG, HEIC...) become WebP, capped at 2048px
#   - SVGs (the logo) get optimized rather than converted
#   - filenames get slugified, so "J&CM Big Band (final) copy 2.JPG" becomes a
#     clean URL instead of something that breaks links
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      svg:
        optimize: true
  default:
    config:
      slugify_filename: true

site_url: https://unlvjazz.jazz-e41.workers.dev

# Saves go straight to main and publish on the next build. The alternative
# (editorial_workflow) adds a draft/review step via pull requests, which is more
# process than a program website needs and one more thing to explain at handoff.
publish_mode: simple

collections:
  - name: content
    label: Site content
    files:
      - name: settings
        label: Logo & homepage photo
        file: src/content/settings.json
        description: >-
          The site logo and the large photo on the homepage. Both are optional —
          leave a photo blank and the page simply renders without it, nothing
          breaks. Uploads are automatically converted to WebP and resized, so
          you can drop in a full-size press photo without worrying about it.
        fields:
          - name: logo
            label: Site logo
            widget: object
            fields:
              - name: src
                label: Logo image
                widget: image
                required: false
                hint: >-
                  An SVG or PNG with a transparent background works best. The
                  program's logos are in the J&CM Logos folder on the shared
                  Drive. Leave blank to show the program name as text instead.
              - name: alt
                label: Alt text
                widget: string
                hint: >-
                  What a screen reader announces. For a logo this is just the
                  program name.
          - name: hero
            label: Homepage photo
            widget: object
            fields:
              - name: src
                label: Photo
                widget: image
                required: false
                hint: >-
                  A wide performance shot works best. Try the J&CM Press Photos
                  folder on the shared Drive.
              - name: alt
                label: Alt text
                widget: string
                required: false
                hint: >-
                  Describe what is happening in the photo for people who can't
                  see it — "Jazz Ensemble I performing at Artemus W. Ham Hall",
                  not "photo" or "hero image".
              - name: credit
                label: Photographer credit
                widget: string
                required: false

      - name: about
        label: About page
        file: src/content/about.json
        description: >-
          Every word on the About page. Two things work inside any text box:
          leave a blank line to start a new paragraph, and put *asterisks*
          around album or magazine titles to italicise them — for example
          *DownBeat* or *Double or Nothing*. Nothing else is interpreted, so
          you can't break the page.
        fields:
          - name: lede
            label: Opening paragraph
            widget: text
            hint: The first thing a visitor reads. Keep it short and concrete.
          - name: degrees
            label: Degrees offered
            label_singular: Degree
            widget: list
            summary: '{{fields.level}}'
            fields:
              - { name: level, label: Degree, widget: string, hint: 'e.g. Master of Music' }
              - name: programs
                label: Programs
                widget: string
                hint: 'Separate several with " · " — e.g. Performance · Composition'
          - name: curriculumNote
            label: Curriculum paragraph
            widget: text
          - name: downbeatAwards
            label: DownBeat awards won since 2010
            widget: number
            value_type: int
            min: 0
            hint: >-
              Just the number — the page writes the sentence around it. It was
              52 in 2025 and 53 after the 2026 win, so update it when the
              program wins again.
          - name: downbeatNote
            label: What the DownBeat awards were for
            widget: text
            hint: >-
              Continues the sentence after the number, so start mid-sentence —
              "category wins and outstanding performance honors for..."
          - name: otherRecognition
            label: Other recognition
            widget: text
          - name: touringNote
            label: Touring paragraph
            widget: text
            hint: Introduces the list of stages below, so it should end with a colon.
          - name: stages
            label: Festivals and venues performed at
            label_singular: Festival or venue
            widget: list
            field: { name: stage, label: Name, widget: string }
          - name: guestArtistsNote
            label: Visiting artists paragraph
            widget: text
            hint: >-
              Name a handful of the most recognizable here. The full list goes
              below and sits behind a "show more" toggle.
          - name: guestArtists
            label: Full list of visiting artists and clinicians
            label_singular: Artist
            widget: list
            field: { name: artist, label: Name, widget: string }
          - name: vegasNote
            label: Las Vegas work paragraph
            widget: text
          - name: vegasArtists
            label: Artists students have performed with in Las Vegas
            label_singular: Artist
            widget: list
            field: { name: artist, label: Name, widget: string }
          - name: alumniNote
            label: Alumni paragraph
            widget: text
            hint: Introduces the list below, so it should end with a colon.
          - name: alumni
            label: Where alumni work
            label_singular: Band or artist
            widget: list
            field: { name: destination, label: Name, widget: string }
          - name: alumniClosing
            label: Closing line
            widget: text

      - name: ensembles
        label: Ensembles
        file: src/content/ensembles.json
        description: >-
          The active ensembles. IMPORTANT: an ensemble finds its own concerts by
          matching its name against the events Google Sheet, so if you rename
          one here, its concerts stop appearing on its page — silently, with no
          error. Either rename it in the Sheet's dropdown to match, or add the
          old name under "Other names used in the events Sheet" below, which
          keeps the old concerts attached. Run `npm run check` after any rename
          to confirm nothing was orphaned.
        fields:
          - name: ensembles
            label: Ensembles
            label_singular: Ensemble
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - name: directors
                label: Directors
                widget: list
                field: { name: director, label: Director, widget: string }
              - name: description
                label: Description
                widget: text
                hint: >-
                  Written for concert-goers and donors — what the group is and
                  what it plays. Audition questions are handled by unlv.edu/music.
              - name: aliases
                label: Other names used in the events Sheet
                label_singular: Other name
                widget: list
                required: false
                field: { name: alias, label: Name, widget: string }
                hint: >-
                  Usually leave empty. Use it when the Sheet credits concerts to
                  a different name that should still show on this ensemble's
                  page — for example a group that was renamed, or two groups
                  that merged. Concerts under any name listed here appear here.
              - name: photo
                label: Photo
                widget: object
                required: false
                fields:
                  - { name: src, label: Photo, widget: image, required: false }
                  - name: alt
                    label: Alt text
                    widget: string
                    required: false
                    hint: >-
                      Describe the photo for people who can't see it, e.g.
                      "Latin Jazz Ensemble on stage at Clark County Library".

      - name: faculty
        label: Faculty
        file: src/content/faculty.json
        description: >-
          Names and teaching assignments only. Bios deliberately link out to the
          UNLV School of Music directory so there is one authoritative source
          rather than a copy here that drifts out of date. Please do not paste
          bios in. Individual email addresses are also left off on purpose.
        fields:
          - name: professors
            label: Professors
            label_singular: Professor
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: credentials, label: Credentials, widget: string, required: false, hint: 'e.g. M.M.' }
              - { name: role, label: Title or role, widget: string }
          - name: adjunct
            label: Adjunct faculty
            label_singular: Adjunct faculty member
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: credentials, label: Credentials, widget: string, required: false }
              - { name: role, label: Instruments and ensembles taught, widget: string }

      - name: albums
        label: Discography
        file: src/content/albums.json
        description: >-
          Every release, newest first. Keep this current — the old website's
          discography stopped at 2017 and made the program look like it had
          quit recording for eight years.
        fields:
          - { name: bandcampUrl, label: Bandcamp page, widget: string }
          - name: albums
            label: Albums
            label_singular: Album
            widget: list
            summary: '{{fields.title}} ({{fields.year}})'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: year, label: Year, widget: number, value_type: int, min: 1970, max: 2100 }
              - { name: artist, label: Performing ensemble, widget: string, required: false }
              - { name: note, label: Note, widget: text, required: false, hint: 'Guest artists, awards, reviews.' }
              - { name: label, label: Record label, widget: string, required: false }
              - { name: catalogNumber, label: Catalog number, widget: string, required: false }
              - { name: url, label: Listen or buy link, widget: string, required: false }
              - { name: cover, label: Cover image, widget: image, required: false }
              - name: tracks
                label: Track listing
                label_singular: Track
                widget: list
                required: false
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: composer, label: Composer, widget: string, required: false }
                  - { name: arranger, label: Arranger, widget: string, required: false }

      - name: supporters
        label: Special thanks
        file: src/content/supporters.json
        description: >-
          Recognition list for the Support page, taken from the concert program.
          Get the names exactly right — a misspelled donor is worse than no
          recognition section.
        fields:
          - name: supporters
            label: Supporters
            label_singular: Supporter
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: url, label: Website, widget: string, required: false }

# Netlify build configuration.
#
# Pinning these here rather than clicking them into the Netlify dashboard is
# deliberate: settings in a dashboard are invisible, undocumented, and lost when
# someone rebuilds the site later. Settings in this file are versioned and
# reviewable, and a fresh Netlify account pointed at this repo configures itself.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node 22 or newer. Netlify's default has historically lagged,
  # which produces a confusing "works locally, fails on deploy" failure.
  NODE_VERSION = "24"

# NO CATCH-ALL 404 REDIRECT HERE, deliberately.
#
# A `from = "/*" -> /404.html` rule was removed 2026-09-03: it made /admin/
# return 404 by shadowing directory-index resolution, and it was redundant in
# the first place. Netlify already serves dist/404.html automatically for any
# unmatched path on a static site. Don't add it back.
